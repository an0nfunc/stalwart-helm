# Stalwart Mail Server Helm Chart
# https://stalw.art/docs/

image:
  repository: stalwartlabs/stalwart
  # Defaults to "v<appVersion>-alpine" if not set
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicas: 1

# -- Mail service configuration
service:
  type: ClusterIP
  annotations: {}
  # -- externalTrafficPolicy for LoadBalancer/NodePort services. Set to "Local"
  # to preserve the upstream source address (e.g. so PROXY-protocol
  # trusted-networks can be restricted to the load balancer's IP).
  # externalTrafficPolicy: Local
  ports:
    smtp: 25
    submission: 587
    imap: 143
    imaps: 993
    https: 443

# -- Optional Ingress for HTTP management UI
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: mail.example.com
  #    paths:
  #      - path: /
  #        pathType: Prefix
  tls: []
  #  - secretName: mail-tls
  #    hosts:
  #      - mail.example.com

# -- Optional Gateway API HTTPRoute for HTTP management UI
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: default
  #    namespace: nginx-gateway
  hostnames: []
  #  - mail.example.com

# -- Persistent storage for RocksDB metadata
persistence:
  enabled: true
  storageClass: ""
  size: 50Gi
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- Prometheus metrics
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
    basicAuth: {}
    #  secretName: stalwart-metrics-auth
    #  usernameKey: username
    #  passwordKey: password

# -- Filesystem paths inside the container.
# Since 0.16 the config file and the data directory are separate. The defaults
# match the upstream image; override dataPath if you are migrating a volume that
# was mounted elsewhere (rewriting the path is not required, and not rewriting it
# avoids the empty-store failure mode described in the README).
configPath: /etc/stalwart/config.json
dataPath: /var/lib/stalwart

# -- Port the health probes target. This is the management listener, which is
# the only one guaranteed to answer /healthz in recovery mode.
probePort: http

# -- Stalwart datastore, rendered to config.json.
# Since 0.16 this file holds the DataStore and NOTHING else: every other setting
# (listeners, TLS, queues, spam filter, directories) lives inside the datastore
# and is applied with `stalwart-cli apply`. See the README for the migration path.
# A tagged union: the "@type" discriminator is required.
config:
  "@type": RocksDb
  path: /var/lib/stalwart

# -- Recovery mode. Disables every background service and exposes only the
# management listener, so an operator can apply configuration to a server that
# cannot start normally. Never leave this on in steady state.
recoveryMode:
  enabled: false
  port: 8080
  logLevel: info

# -- Recovery administrator, supplied as STALWART_RECOVERY_ADMIN ("user:password").
# This is a back door: it authenticates even outside recovery mode. Enable it to
# bootstrap a fresh or freshly migrated server, then disable it and redeploy.
recoveryAdmin:
  enabled: false
  # -- "user:password". Ignored when existingSecret is set.
  value: ""
  # -- Reference a Secret you manage instead of having the chart create one.
  existingSecret: ""
  secretKey: STALWART_RECOVERY_ADMIN

# -- Additional environment variables
env: []

# -- Environment variables from Secrets/ConfigMaps
envFrom: []
#  - secretRef:
#      name: stalwart-secrets

# -- Additional pod labels
podLabels: {}

# -- Additional pod annotations
podAnnotations: {}

# -- Priority class name
priorityClassName: ""

# -- Node affinity rules
affinity: {}

# -- Node tolerations
tolerations: []

# -- Node selector
nodeSelector: {}

# -- Override the container entrypoint. Empty uses the image's own entrypoint.
# Setting this replaces the entrypoint entirely, so the command you supply is
# responsible for starting Stalwart with its config path. See the README for the
# open-file-limit recipe, the most common reason to set this.
command: []

# -- Arguments passed to the container. Empty uses the image's own arguments.
args: []

# -- Pod security context
podSecurityContext: {}

# -- Container security context
securityContext: {}

# -- Extra volume mounts for the stalwart container
extraVolumeMounts: []

# -- Extra volumes for the pod
extraVolumes: []

# -- Init containers
initContainers: []

# -- Optional NetworkPolicy.
# When enabled, restricts ingress to the public mail protocols (and the management API
# only from the namespace selectors / pod selectors you specify). Default: disabled to
# preserve backward compatibility — explicitly opt in by setting `networkPolicy.enabled: true`.
networkPolicy:
  enabled: false
  # -- Ports allowed from anywhere (mail protocols, public-facing).
  # Defaults to the mail protocol ports defined under .Values.service.ports.
  publicPorts: []
  # -- Ingress rules for the management HTTP API (port 8080).
  # Provide namespaceSelector/podSelector blocks; leaving empty disables management ingress.
  managementAPI:
    # Example:
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: cpbackend
    #   ports:
    #     - protocol: TCP
    #       port: 8080
    rules: []
