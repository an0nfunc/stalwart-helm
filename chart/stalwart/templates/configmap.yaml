{{- if .Values.config }}
{{- if not (hasKey .Values.config "@type") }}
{{- fail "config must be a Stalwart DataStore object and requires an \"@type\" discriminator, e.g. {\"@type\": \"RocksDb\", \"path\": \"/var/lib/stalwart\"}. Since 0.16 the config file holds the datastore and nothing else; every other setting lives in the datastore itself and is applied with stalwart-cli. See the chart README." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stalwart.fullname" . }}-config
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
data:
  config.json: |
    {{- .Values.config | toPrettyJson | nindent 4 }}
{{- end }}
