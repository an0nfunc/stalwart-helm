{{- if and .Values.recoveryAdmin.enabled (not .Values.recoveryAdmin.existingSecret) }}
{{- if not .Values.recoveryAdmin.value }}
{{- fail "recoveryAdmin.enabled is set but neither recoveryAdmin.value nor recoveryAdmin.existingSecret is provided. The value must be \"user:password\"." }}
{{- end }}
{{- if not (regexMatch "^[^:]+:.+$" .Values.recoveryAdmin.value) }}
{{- fail "recoveryAdmin.value must be of the form \"user:password\"." }}
{{- end }}
{{- $secret := splitn ":" 2 .Values.recoveryAdmin.value }}
{{- if regexMatch "^[$_{]" $secret._1 }}
{{- fail "recoveryAdmin.value's password starts with '$', '_' or '{', which Stalwart parses as a pre-hashed secret rather than a password. Pick another one." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stalwart.fullname" . }}-recovery
  labels:
    {{- include "stalwart.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.recoveryAdmin.secretKey }}: {{ .Values.recoveryAdmin.value | quote }}
{{- end }}
