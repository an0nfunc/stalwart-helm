name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint chart/stalwart

      - name: Helm template (defaults)
        run: helm template stalwart chart/stalwart

      - name: Assert config.json is valid and carries a DataStore
        run: |
          helm template stalwart chart/stalwart | python3 -c '
          import sys, json, yaml
          for d in yaml.safe_load_all(sys.stdin):
              if d and d.get("kind") == "ConfigMap" and "config.json" in d.get("data", {}):
                  cfg = json.loads(d["data"]["config.json"])
                  assert "@type" in cfg, "config.json has no @type discriminator"
                  print("config.json OK:", cfg["@type"])
                  break
          else:
              raise SystemExit("no config.json ConfigMap rendered")
          '

      - name: Assert the metrics Service keeps its name
        run: |
          helm template stalwart chart/stalwart --set metrics.enabled=true \
            | grep -q "name: stalwart-metrics"

      - name: Helm template (examples)
        run: |
          for f in examples/*.yaml; do
            echo "--- Templating with $f ---"
            helm template stalwart chart/stalwart -f "$f"
          done

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate templates
        run: |
          helm template stalwart chart/stalwart | kubeconform -strict -ignore-missing-schemas
          for f in examples/*.yaml; do
            echo "--- Validating with $f ---"
            helm template stalwart chart/stalwart -f "$f" | kubeconform -strict -ignore-missing-schemas
          done

  release:
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      # Guards against cutting a tag without bumping Chart.yaml, which would
      # republish the previous chart version over itself.
      - name: Package chart
        run: |
          chart_version=$(helm show chart chart/stalwart | awk '/^version:/ {print $2}')
          tag_version=${GITHUB_REF_NAME#v}
          if [ "$chart_version" != "$tag_version" ]; then
            echo "::error::Chart.yaml version $chart_version does not match tag $tag_version" >&2
            exit 1
          fi
          helm package chart/stalwart

      - name: Push to OCI registry
        run: helm push stalwart-*.tgz oci://ghcr.io/itsh-cloud/charts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: stalwart-*.tgz
          # Defaults to false, so a path that stops matching drops the asset
          # from the release without failing the run.
          fail_on_unmatched_files: true
