# Minimal Stalwart 0.16 deployment.
#
# config.json carries the datastore and nothing else. Everything a mail server
# actually needs (listeners, TLS, domains, accounts, spam filtering) lives inside
# that datastore and is applied afterwards with stalwart-cli. See
# examples/recovery-bootstrap.yaml for that step.

config:
  "@type": RocksDb
  path: /var/lib/stalwart

persistence:
  enabled: true
  size: 20Gi

service:
  type: ClusterIP
  ports:
    smtp: 25
    submission: 587
    imaps: 993
    https: 443
